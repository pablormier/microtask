<template x-if="mode === 'drafts'">
      <section class="mt-drafts-view">
        <header class="mt-drafts-header">
          <div>
            <h2>Drafts</h2>
            <p class="mt-drafts-help">Incomplete writing is saved here until you create a card or apply an edit.</p>
          </div>
        </header>
        <div class="mt-drafts-actions mt-layout-group" role="group" aria-label="Draft actions">
          <button type="button" class="mt-button mt-button-primary" @click="beginNewCapture($event)">
            <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>New</span>
          </button>
          <label class="mt-draft-search">
            <span class="mt-sr-only">Search drafts</span>
            <input class="mt-field" type="search" x-model="draftSearch" aria-label="Search drafts" placeholder="Search drafts">
          </label>
        </div>
        <p class="mt-draft-workspace-status" role="status" aria-live="polite"
           :class="{ 'is-error': draftWorkspaceStatus === 'Error' }"
           x-show="draftWorkspaceStatus" x-text="draftWorkspaceStatus"></p>
        <template x-if="visibleDrafts().length === 0">
          <p class="mt-empty" x-text="draftSearch.trim() ? 'No drafts match this search.' : 'No drafts yet.'"></p>
        </template>
        <div class="mt-draft-list" role="list" aria-label="Workspace drafts">
          <template x-for="draft in visibleDrafts()" :key="draft.id">
            <button type="button" class="mt-button mt-draft-row" role="listitem" @click="openWorkspaceDraft(draft)">
              <span class="mt-draft-main">
                <span class="mt-draft-title" x-text="draftDisplayTitle(draft)"></span>
                <span class="mt-draft-excerpt" x-text="draftExcerpt(draft)"></span>
              </span>
              <span class="mt-draft-meta">
                <span class="mt-badge mt-badge-neutral" x-text="draft.kind + (draft.mode === 'new' ? ' · new' : ' · edit')"></span>
                <span class="mt-draft-saved" x-show="!draft._localRecovery" x-text="'Saved ' + draftSavedLabel(draft.updated)"></span>
                <span class="mt-draft-saved mt-draft-local-label" x-show="draft._localRecovery"
                      x-text="draft._orphanedLocal ? 'Local copy · workspace draft changed or removed' : (draft._staleLocal ? 'Local copy · workspace revision changed' : 'Local recovery copy')"></span>
              </span>
            </button>
          </template>
        </div>
      </section>
</template>
