<template x-if="mode === 'focus'">
<div class="mt-focus-view">
      <section class="mt-focus-section" aria-labelledby="mt-focus-now-title">
        <h2 class="mt-focus-heading" id="mt-focus-now-title">Now</h2>
        <template x-if="focusTask()">
          <article class="mt-focus-card mt-surface">
            <div class="mt-focus-card-head">
              <button type="button" class="mt-button mt-focus-title" @click="select(focusTask(), $event)" x-text="focusTask().title"></button>
              <span class="mt-badge mt-priority" x-show="hasPriority(focusTask().priority)" :class="priorityClass(focusTask().priority)" x-text="focusTask().priority"></span>
            </div>
            <div class="mt-focus-meta">
              <span class="mt-badge mt-status-badge" :class="statusBadgeClass(focusTask().status)" x-text="statusText(focusTask().status)"></span>
              <template x-if="focusTask().due">
                <time class="mt-badge mt-due" :class="dueClass(focusTask())" :datetime="focusTask().due" :title="focusTask().due" x-text="'Due ' + dateLabel(focusTask().due)"></time>
              </template>
              <span class="mt-focus-reason" x-show="focusReason(focusTask())" x-text="'Picked because ' + focusReason(focusTask())"></span>
            </div>
            <p class="mt-focus-next" :class="!focusTask().next_action && 'is-missing'">
              <span class="mt-focus-next-label">Next</span>
              <span x-text="focusTask().next_action || 'No next step yet. Open the card and write one.'"></span>
            </p>
            <div class="mt-focus-card-foot">
              <div class="mt-time-buttons" x-cloak>
                <button type="button" class="mt-button mt-button-compact mt-time-start" x-cloak x-show="showStartTimer(focusTask())" @click="startTimer(focusTask())" :disabled="!canStartTimer(focusTask())" :aria-label="focusTask() && 'Start timer for ' + focusTask().title">Start</button>
                <button type="button" class="mt-button mt-button-compact mt-time-stop" x-cloak x-show="showStopTimer(focusTask())" @click="stopTimer(focusTask())" :disabled="!canStopTimer(focusTask())" :aria-label="focusTask() && 'Stop timer for ' + focusTask().title">Stop</button>
                {timer_menu}
              </div>
              <div class="mt-focus-time mt-time-values mt-layout-group" role="group" aria-label="Task time">
                <span class="mt-time-session" x-show="timerRunningFor(focusTask())" x-text="timerSessionLabel(focusTask())"></span>
                <span class="mt-time-total" x-text="savedTimeLabel(focusTask())"></span>
              </div>
              <span class="mt-ref" title="Card reference" x-text="focusTask().ref"></span>
            </div>
          </article>
        </template>
        <template x-if="!focusTask()">
          <p class="mt-empty">No open focus task.</p>
        </template>
      </section>

      <section class="mt-focus-section mt-focus-attention" x-show="focusModeTasks().length" aria-labelledby="mt-focus-attention-title">
        <h2 class="mt-focus-heading" id="mt-focus-attention-title">Needs attention <span class="mt-panel-count" x-text="focusModeTasks().length"></span></h2>
        <ul class="mt-focus-list mt-surface">
          <template x-for="task in focusModeTasks()" :key="task.id">
            <li class="mt-focus-row" :class="dueClass(task)" role="button" tabindex="0" @click="select(task, $event)" @keydown.enter.stop.prevent="select(task, $event)" @keydown.space.stop.prevent="select(task, $event)">
              <span class="mt-focus-row-title" x-text="task.title"></span>
              <span class="mt-focus-row-badges">
                <span class="mt-badge mt-priority" x-show="hasPriority(task.priority)" :class="priorityClass(task.priority)" x-text="task.priority"></span>
                <template x-if="task.due">
                  <time class="mt-badge mt-due" :class="dueClass(task)" :datetime="task.due" :title="task.due" x-text="'Due ' + dateLabel(task.due)"></time>
                </template>
              </span>
              <span class="mt-focus-row-detail">
                <span class="mt-focus-row-hint" x-show="focusAlertLabel(task)" x-text="focusAlertLabel(task)"></span>
                <span class="mt-focus-row-hint is-warning" x-show="needsRestartStep(task)">No clear next step</span>
                <span class="mt-focus-row-next" x-show="task.next_action && !needsRestartStep(task)" x-text="task.next_action"></span>
              </span>
            </li>
          </template>
        </ul>
      </section>

      <section class="mt-focus-section mt-followups" x-show="followupTasks().length" aria-labelledby="mt-focus-followups-title">
        <h2 class="mt-focus-heading" id="mt-focus-followups-title">Waiting on others <span class="mt-panel-count" x-text="followupTasks().length"></span></h2>
        <ul class="mt-focus-list mt-surface">
          <template x-for="task in followupTasks()" :key="task.id">
            <li class="mt-focus-row" :class="dueClass(task)" role="button" tabindex="0" @click="select(task, $event)" @keydown.enter.stop.prevent="select(task, $event)" @keydown.space.stop.prevent="select(task, $event)">
              <span class="mt-focus-row-title" x-text="task.title"></span>
              <span class="mt-focus-row-badges">
                <template x-if="task.due">
                  <time class="mt-badge mt-due" :class="dueClass(task)" :datetime="task.due" :title="task.due" x-text="'Due ' + dateLabel(task.due)"></time>
                </template>
              </span>
              <span class="mt-focus-row-detail">
                <span class="mt-focus-row-next" x-text="task.next_action || 'No next step'"></span>
              </span>
            </li>
          </template>
        </ul>
      </section>
</div>
</template>
