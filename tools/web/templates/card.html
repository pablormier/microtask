              <article class="mt-card mt-surface" role="button" tabindex="0"
                       :class="cardClass(task)"
                       @click="select(task, $event)" @keydown.enter.stop.prevent="select(task, $event)" @keydown.space.stop.prevent="select(task, $event)">
                <details class="mt-card-menu mt-card-inline-menu" x-show="canOrderCard(task)"
                         x-data="{ menuOpen: false }"
                         @toggle="menuOpen = $el.open"
                         @click.stop @keydown.enter.stop @keydown.space.stop
                         @click.outside="$el.open = false"
                         @keydown.escape.stop="$el.open = false; $el.querySelector('summary').focus()">
                  <summary class="mt-menu-trigger" :aria-label="'Order actions for ' + task.title" title="Card order">
                    <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
                  </summary>
                  <template x-if="menuOpen">
                    <div class="mt-card-menu-items mt-card-order-bar">
                      <button type="button" class="mt-button mt-button-quiet mt-button-icon mt-button-compact" title="Move to top" aria-label="Move to top" :disabled="busy || !cardGroupNeighbors(task).prev" @click="$el.closest('details').open = false; orderCard(task, { position: 'top' })">
                        <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 5h14M12 19V9M7.5 13.5 12 9l4.5 4.5"/></svg>
                      </button>
                      <button type="button" class="mt-button mt-button-quiet mt-button-icon mt-button-compact" title="Move up" aria-label="Move up" :disabled="busy || !cardGroupNeighbors(task).prev" @click="$el.closest('details').open = false; moveCardStep(task, -1)">
                        <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></svg>
                      </button>
                      <button type="button" class="mt-button mt-button-quiet mt-button-icon mt-button-compact" title="Move down" aria-label="Move down" :disabled="busy || !cardGroupNeighbors(task).next" @click="$el.closest('details').open = false; moveCardStep(task, 1)">
                        <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M6.5 13.5 12 19l5.5-5.5"/></svg>
                      </button>
                      <button type="button" class="mt-button mt-button-quiet mt-button-icon mt-button-compact" title="Move to bottom" aria-label="Move to bottom" :disabled="busy || !cardGroupNeighbors(task).next" @click="$el.closest('details').open = false; orderCard(task, { position: 'bottom' })">
                        <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 19h14M12 5v10M7.5 10.5 12 15l4.5-4.5"/></svg>
                      </button>
                      <button type="button" class="mt-button mt-button-quiet mt-button-icon mt-button-compact" x-show="task.order" title="Reset order" aria-label="Reset order" :disabled="busy" @click="$el.closest('details').open = false; orderCard(task, { position: 'clear' })">
                        <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>
                      </button>
                    </div>
                  </template>
                </details>
                <div class="mt-title" x-text="task.title"></div>
                <div class="mt-card-meta">
                  <span class="mt-badge mt-priority" x-show="hasPriority(task.priority)" :class="priorityClass(task.priority)" :title="'Priority: ' + task.priority" x-text="task.priority"></span>
                  <template x-if="task.due">
                    <span class="mt-card-due">
                      <time class="mt-badge mt-due" :class="dueClass(task)" :datetime="task.due" :title="'Due ' + dateLabel(task.due)" x-text="'Due ' + shortDateLabel(task.due)"></time>
                      <template x-if="showCardDeadlineProgress(task)">
                        <span class="mt-progress-ring" :title="deadlineProgressTitle(task)" role="progressbar" :aria-label="'Time elapsed toward ' + task.title" :aria-valuenow="deadlineProgressPercent(task)" aria-valuemin="0" aria-valuemax="100">
                          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                            <circle class="mt-progress-ring-track" cx="10" cy="10" r="7.5"/>
                            <circle class="mt-progress-ring-fill" cx="10" cy="10" r="7.5" pathLength="100" :style="'stroke-dashoffset:' + (100 - deadlineProgressPercent(task)) + ';--mt-deadline-elapsed:' + deadlineProgressPercent(task) + '%'"/>
                          </svg>
                        </span>
                      </template>
                    </span>
                  </template>
                  <span class="mt-badge mt-status-badge" :class="statusBadgeClass(task.status)" x-show="showCardStatus(task) && task.status" x-text="statusText(task.status)"></span>
                  <span class="mt-badge mt-badge-warning mt-needs-review" x-show="task.needs_review">Needs review</span>
                  <span class="mt-badge mt-badge-accent mt-timer-badge" x-show="timerRunningFor(task) && !timerStale(task)" :title="timerBadgeTitle(task)" x-text="timerBadgeLabel(task)"></span>
                  <span class="mt-badge mt-badge-warning" x-show="timerStale(task)" title="This timer has run longer than the warning threshold. Check the duration before saving.">Check timer</span>
                  <template x-if="needsRestartStep(task)">
                    <span class="mt-badge mt-badge-danger mt-badge-square mt-restart-badge">needs restart step</span>
                  </template>
                  <template x-if="task.claimed_by">
                    <span class="mt-ref mt-card-claim" :title="'Claimed at ' + task.claimed_at" x-text="'Working: ' + task.claimed_by"></span>
                  </template>
                  <template x-if="cardDate(task)">
                    <time class="mt-card-date" :datetime="cardDate(task)" :title="dateLabel(cardDate(task))" x-text="(task.status === 'done' ? 'Completed ' : 'Updated ') + shortDateLabel(cardDate(task))"></time>
                  </template>
                  <template x-if="task.topic && settings[mode]?.group !== 'topic'">
                    <span class="mt-card-topic" :title="'Topic: ' + task.topic" x-text="topicSegments(task.topic).join(' › ')"></span>
                  </template>
                </div>
                <template x-if="task.next_action">
                  <div class="mt-next" x-text="task.next_action"></div>
                </template>
                <template x-if="!task.next_action && task.excerpt">
                  <div class="mt-next" x-text="task.excerpt"></div>
                </template>
                <div class="mt-card-footer">
                  <div class="mt-tags">
                    <template x-for="tag in (task.tags || [])" :key="tag">
                      <span class="mt-badge mt-badge-success mt-tag" :title="tag" x-text="tag"></span>
                    </template>
                  </div>
                  <div class="mt-card-footer-meta">
                    <span class="mt-card-time" x-show="task.kind === 'task' && hasTrackedTime(task)" :title="savedTimeLabel(task)">
                      <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                      <span x-text="savedTimeShort(task)"></span>
                    </span>
                    <span class="mt-card-ordered" x-show="task.order" title="Custom order" aria-label="Custom order">
                      <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
                    </span>
                    <span class="mt-comment-count" x-show="task.comment_count" :title="task.comment_count === 1 ? '1 comment' : task.comment_count + ' comments'">
                      <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 12.5a7.5 7.5 0 0 1-10.9 6.7L4 20.5l1.4-4.4A7.5 7.5 0 1 1 20 12.5Z"/></svg>
                      <span x-text="task.comment_count" aria-hidden="true"></span><span class="mt-sr-only" x-text="task.comment_count === 1 ? '1 comment' : task.comment_count + ' comments'"></span>
                    </span>
                    <span class="mt-ref mt-card-ref" title="Card reference" x-text="task.ref"></span>
                  </div>
                </div>
              </article>
