      <template x-if="captureComposer.open && captureComposer.draft">
        <div class="mt-composer-backdrop mt-dialog-backdrop" @click.self="captureComposer.close(captureContext())">
          <section class="mt-composer mt-dialog" role="dialog" aria-modal="true"
                   x-ref="composerDialog" @keydown.tab="trapComposerFocus($event)"
                   aria-labelledby="mt-composer-title" aria-describedby="mt-composer-help"
                   @keydown.escape.stop.prevent="captureComposer.close(captureContext())"
                   @keydown.meta.enter.stop.prevent="captureComposer.save(captureContext())"
                   @keydown.ctrl.enter.stop.prevent="captureComposer.save(captureContext())">
            <header class="mt-composer-header">
              <div>
                <h2 id="mt-composer-title" x-text="captureComposer.title()"></h2>
              </div>
              <template x-if="captureComposer.draft?.mode === 'new'">
                <div class="mt-capture-kind mt-segmented" role="group" aria-label="Create a note or task">
                  <button type="button" class="mt-segment" :aria-pressed="captureComposer.draft?.kind === 'note'" @click="captureComposer.setKind(captureContext(), 'note')" :disabled="captureComposer.saving">Note</button>
                  <button type="button" class="mt-segment" :aria-pressed="captureComposer.draft?.kind === 'task'" @click="captureComposer.setKind(captureContext(), 'task')" :disabled="captureComposer.saving">Task</button>
                </div>
              </template>
              <button type="button" class="mt-button mt-button-quiet mt-button-icon mt-close" aria-label="Close capture editor" @click="captureComposer.close(captureContext())"><svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
            </header>
            <div class="mt-composer-content">
              <p id="mt-composer-help" class="mt-composer-capture-date">Saved as a draft as you type. Close anytime to continue later.</p>
              <template x-if="captureComposer.draft && captureComposer.draft?.mode === 'new'">
                <label class="mt-composer-title-field">
                  <span class="mt-sr-only">Title (optional)</span>
                  <input class="mt-field mt-field-property" type="text" placeholder="Title (optional)" x-model="captureComposer.draft.title" @input="captureComposer.persist(captureContext())"
                         :disabled="captureComposer.saving" autocomplete="off" aria-label="Optional capture title">
                </label>
              </template>
              <template x-if="captureComposer.draft?.mode === 'new'">
                <div class="mt-capture-properties" x-data="cardMetadataEditor(captureComposer.draft?.taskOptions || {}, true, 'capture', cardMetadataConfig(), captureComposer.draft?.taskMetadataErrors || {}, captureComposer.draft?.kind)"
                     x-effect="disabled = captureComposer.saving || busy; cardKind = captureComposer.draft?.kind || 'note'; fieldErrors = captureComposer.draft?.taskMetadataErrors || {}; if (['type', 'project', 'topic', 'tags'].some(field => fieldErrors[field])) morePropertiesOpen = true"
                     @metadata-change="captureComposer.draft.taskOptions = $event.detail; captureComposer.persist(captureContext())">
                  {card_metadata_editor}
                </div>
              </template>
              <div class="mt-composer-body-label-row">
                <label for="mt-composer-body" x-text="captureComposer.draft?.kind === 'task' ? 'Description' : 'Note'"></label>
                <button type="button" class="mt-button mt-button-compact mt-button-quiet mt-composer-template" @click="captureComposer.applyMeetingTemplate(captureContext())"
                        x-show="captureComposer.draft && captureComposer.draft?.mode === 'new' && captureComposer.draft?.kind === 'note'" :disabled="captureComposer.saving">Insert meeting template</button>
              </div>
              <textarea id="mt-composer-body" x-ref="composerBody" class="mt-field mt-composer-body" x-model="captureComposer.draft.text"
                        @input="captureComposer.persist(captureContext())" :disabled="captureComposer.saving"
                        :placeholder="!captureComposer.draft ? '' : (captureComposer.draft?.mode === 'edit' ? '' : (captureComposer.draft?.kind === 'task' ? 'What do you want to accomplish?' : 'Write a thought, observation, or meeting note…'))"
                        aria-label="Capture text"></textarea>
              <template x-if="captureComposer.draft?.mode === 'new'">
                <details class="mt-processing-instructions mt-extra-details"
                         :open="Boolean(captureComposer.draft?.instructions && captureComposer.draft.instructions.trim())">
                  <summary class="mt-extra-summary">
                    <span class="mt-extra-summary-copy">
                      <span class="mt-extra-summary-label">Processing instructions</span>
                      <span class="mt-detail-summary-meta">(optional)</span>
                    </span>
                    <span class="mt-extra-chevron" aria-hidden="true"></span>
                  </summary>
                  <label for="mt-processing-instructions">How should this capture be organized or triaged?</label>
                  <textarea id="mt-processing-instructions" class="mt-field" rows="4"
                            x-model="captureComposer.draft.instructions"
                            @input="captureComposer.persist(captureContext())"
                            :disabled="captureComposer.saving"
                            placeholder="Add guidance for organizing or triaging this capture"></textarea>
                </details>
              </template>
              <p class="mt-composer-recovery-warning" role="status" x-show="captureComposer.recoveryWarning" x-text="captureComposer.recoveryWarning"></p>
              <p class="mt-composer-recovery-warning" role="status" x-show="captureComposer.draft && captureComposer.draft._orphanedLocal">This local copy no longer matches the workspace draft. Recover it as a separate draft or dismiss the local copy.</p>
              <p class="mt-composer-recovery-warning" role="status" x-show="draftNeedsReconciliation(captureComposer.draft)">This edit has no verified target baseline and needs manual reconciliation before it can be applied.</p>
              <p class="mt-composer-storage-status" role="status" aria-live="polite" x-show="draftWorkspaceStatus" :class="{ 'is-error': draftWorkspaceStatus === 'Error' }" x-text="draftWorkspaceStatus"></p>
              <p class="mt-composer-storage-status" x-show="captureComposer.persisted && !draftWorkspaceStatus && !captureComposer.recoveryWarning">Local recovery copy ready</p>
              <p class="mt-composer-recovery-warning" x-show="captureComposer.draft && captureComposer.draft?.mode === 'new' && captureComposer.draft?.kind === 'note' && captureComposer.isMeetingTemplateOnly()">Add note text under a heading before saving the template.</p>
              <p class="mt-composer-recovery-warning" x-show="captureComposer.draft && captureComposer.draft?.mode === 'new' && captureComposer.draft.taskOptions?.due && !captureComposer.draft.taskOptions?.due_kind">Choose a date meaning before saving.</p>
              <p class="mt-composer-action-status" role="status" aria-live="polite"
                 :class="{ 'is-error': captureComposer.messageError }" x-text="captureComposer.message"></p>
            </div>
            <template x-if="captureComposer.draft && captureComposer.draft._orphanedLocal">
              <footer class="mt-composer-footer">
                <button type="button" class="mt-button mt-button-danger mt-composer-discard" @click="captureComposer.discard(captureContext())" :disabled="draftBusy">Dismiss local copy</button>
                <button type="button" class="mt-button mt-button-primary mt-composer-save" @click="recoverLocalWorkspaceDraft(captureComposer.draft)" :disabled="draftBusy" :aria-busy="draftBusy">Recover as separate draft</button>
              </footer>
            </template>
            <template x-if="captureComposer.draft && !captureComposer.draft._orphanedLocal">
              <footer class="mt-composer-footer">
                <button type="button" class="mt-button mt-button-danger mt-composer-discard" @click="captureComposer.discard(captureContext())" :disabled="captureComposer.saving || busy" :aria-busy="captureComposer.saving || busy">Discard draft</button>
                <span class="mt-composer-shortcut" title="Command or Control + Enter saves"><kbd>⌘/Ctrl</kbd><kbd>Enter</kbd></span>
                <button type="button" class="mt-button mt-button-primary mt-composer-save" @click="captureComposer.save(captureContext())"
                        :disabled="!captureComposer.canSave(captureContext()) || captureComposer.saving || busy" :aria-busy="captureComposer.saving || busy">
                  <span x-text="captureComposer.saveLabel()"></span>
                </button>
              </footer>
            </template>
          </section>
        </div>
      </template>
