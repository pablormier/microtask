      <template x-if="selected">
        <div class="mt-detail-backdrop mt-dialog-backdrop" :class="{ 'is-zen': Boolean(contentEditor.open && contentEditor.zen) }" @click.self="if (!(contentEditor.open && contentEditor.zen)) clearSelection()" @keydown.escape.window="if (hoverCard) { clearHoverCard(); } else if (contentEditor.open && contentEditor.handleEscape(contentContext())) { /* handled by editor */ } else if (!captureComposer.open) { clearSelection(); }">
          <section class="mt-detail mt-dialog" role="dialog" :class="{ 'is-zen': Boolean(contentEditor.open && contentEditor.zen) }" aria-modal="true" aria-labelledby="mt-detail-title"
                   x-ref="detailDialog" tabindex="-1" @keydown.tab="trapDetailFocus($event)"
                   @keydown.meta.shift.f.stop.prevent="if (contentEditor.open) { contentEditor.toggleZen(contentContext()); } else if (selected && typeof selected.body === 'string' && !busy && !draftBusy && !detailLoading && !detailError) { openSelectedInZen(); }"
                   @keydown.ctrl.shift.f.stop.prevent="if (contentEditor.open) { contentEditor.toggleZen(contentContext()); } else if (selected && typeof selected.body === 'string' && !busy && !draftBusy && !detailLoading && !detailError) { openSelectedInZen(); }">
            <header class="mt-detail-header">
              <div class="mt-detail-heading">
                <div class="mt-detail-identity"><span class="mt-ref" x-text="selected?.ref"></span><span x-text="selected?.kind === 'note' ? 'Note' : 'Task'"></span><span x-show="selected?.archived">Archived</span><span x-show="selected?.hidden">Hidden</span></div>
                <h2 id="mt-detail-title" class="mt-detail-title">
                  <template x-if="propertyEditor.form">
                    <textarea class="mt-detail-title-input" rows="1" form="mt-properties-form" aria-label="Title" spellcheck="false"
                              x-model="propertyEditor.form.title" :disabled="busy || draftBusy || propertyEditor.saving"
                              x-effect="propertyEditor.form.title; $nextTick(() => { $el.style.height = 'auto'; $el.style.height = $el.scrollHeight + 'px'; })"
                              x-init="let width = 0; new ResizeObserver(([entry]) => { if (entry.contentRect.width === width) return; width = entry.contentRect.width; $el.style.height = 'auto'; $el.style.height = $el.scrollHeight + 'px'; }).observe($el)"
                              @keydown.enter.prevent="$el.form && $el.form.requestSubmit()"
                              @keydown.escape.stop="propertyEditor.form.title = selected?.title || ''; $el.blur()"></textarea>
                  </template>
                  <template x-if="!propertyEditor.form"><span x-text="selected?.title"></span></template>
                </h2>
              </div>
              <div class="mt-detail-navigation">
                <button type="button" class="mt-button mt-button-quiet mt-button-compact mt-zen-meta-toggle"
                        x-show="contentEditor.zen && propertyEditor.form"
                        :aria-expanded="contentEditor.zenMetaOpen"
                        aria-controls="mt-detail-properties-panel"
                        @click="contentEditor.zenMetaOpen = !contentEditor.zenMetaOpen">
                  <span>Properties</span>
                  <span class="mt-zen-meta-badge" x-show="!contentEditor.zenMetaOpen && contentEditor.zenMetaSummary(propertyEditor.form)" x-text="contentEditor.zenMetaSummary(propertyEditor.form)"></span>
                </button>
                <button class="mt-button mt-button-quiet mt-button-compact mt-detail-back" type="button" aria-label="Back to previous card" x-show="canGoBackReference()" @click="backReference()"><svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m12 5-7 7 7 7M5 12h14"/></svg><span>Back</span></button>
                <details class="mt-card-menu" @click.outside="$el.open = false" @keydown.escape.stop="$el.open = false; $el.querySelector('summary').focus()">
                  <summary class="mt-menu-trigger" aria-label="More card actions" title="More card actions"><svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></summary>
                  <div class="mt-card-menu-items">
                    <button type="button" class="mt-button mt-button-compact" @click="archiveSelected()" :disabled="busy || draftBusy || !!contentEditor.open" :aria-busy="busy" x-text="selected?.archived ? 'Unarchive' : 'Archive'"></button>
                    <button type="button" class="mt-button mt-button-compact" @click="hideSelected()" :disabled="busy || draftBusy || !!contentEditor.open" :aria-busy="busy" x-text="selected?.hidden ? 'Show in lists' : 'Hide from lists'"></button>
                  </div>
                </details>
                <button class="mt-button mt-button-quiet mt-button-icon mt-close" type="button" aria-label="Close preview" @click="clearSelection()"><svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
              </div>
            </header>
            <div class="mt-detail-workbar" x-show="selected?.kind === 'task' || selected?.needs_review">
              <div class="mt-detail-status">
                <template x-if="selected?.kind === 'task'">
                  <select class="mt-field mt-field-compact mt-status-select" :data-status="moveDestination" x-model="moveDestination" @change="changeSelectedStatus()" :disabled="!canMoveSelected() || busy || draftBusy || !!contentEditor.open" aria-label="Task status">
                    <template x-for="status in statuses" :key="status"><option :value="status" :selected="status === moveDestination" x-text="statusText(status)"></option></template>
                  </select>
                </template>
                <span class="mt-detail-owner" x-show="selected?.claimed_by" x-text="'Working: ' + selected?.claimed_by"></span>
                <span class="mt-badge mt-badge-warning" x-show="selected?.needs_review">Needs review</span>
                <button type="button" class="mt-button mt-button-compact" x-show="selected?.needs_review" @click="markReviewed(selected)" :disabled="busy || draftBusy || !!contentEditor.open">Mark reviewed</button>
              </div>
              <div class="mt-detail-timer mt-layout-group" x-show="selected?.kind === 'task'" role="group" aria-label="Task timer">
                <span class="mt-time-readout">
                  <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M10 2h4"/></svg>
                  <span class="mt-time-session" x-show="timerRunningFor(selected)" x-text="timerSessionLabel(selected)"></span>
                  <span class="mt-time-total" x-text="savedTimeLabel(selected)"></span>
                </span>
                <button type="button" class="mt-button mt-button-compact" x-show="showStartTimer(selected)" @click="startTimer(selected)" :disabled="!canStartTimer(selected) || !!contentEditor.open" :aria-label="'Start timer for ' + selected?.title">Start</button>
                <button type="button" class="mt-button mt-button-compact" x-show="showStopTimer(selected)" @click="stopTimer(selected)" :disabled="!canStopTimer(selected) || !!contentEditor.open" :aria-label="'Stop timer for ' + selected?.title">Stop</button>
                {timer_menu}
              </div>
            </div>
            <div class="mt-detail-layout">
              <section class="mt-detail-content" aria-label="Card content">
                <header class="mt-content-header">
                  <h3>Content</h3>
                  <div class="mt-layout-group" x-show="!contentEditor.open">
                    <button type="button" class="mt-button mt-button-compact mt-content-edit" x-ref="contentEditButton" @click="contentEditor.begin(contentContext())" :disabled="busy || draftBusy || detailLoading || !!detailError || typeof selected?.body !== 'string'">Edit content</button>
                    <button type="button" class="mt-button mt-button-quiet mt-button-icon mt-button-compact mt-content-edit-zen"
                            aria-label="Edit in Zen mode" title="Edit in Zen mode (⌘/Ctrl+Shift+F)"
                            @click="openSelectedInZen()"
                            :disabled="busy || draftBusy || detailLoading || !!detailError || typeof selected?.body !== 'string'">
                      <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                      </svg>
                    </button>
                  </div>
                </header>
                <p class="mt-content-load-status" role="status" x-show="detailLoading">Loading card content…</p>
                <div class="mt-content-load-error" role="alert" x-show="detailError">
                  <p x-text="detailError"></p>
                  <button type="button" class="mt-button mt-button-compact" @click="loadSelectedDetails(true)" :disabled="detailLoading">Retry content</button>
                </div>
                <template x-if="contentEditor.open">
                  <div class="mt-content-editor">
                    <div class="mt-content-editor-toolbar">
                      <div class="mt-segmented" role="group" aria-label="Content editor mode" x-show="!contentEditor.zen">
                        <button class="mt-segment" type="button" :aria-pressed="contentEditor.tab === 'write'" @click="contentEditor.tab = 'write'">Write</button>
                        <button class="mt-segment" type="button" :aria-pressed="contentEditor.tab === 'preview'" @click="contentEditor.tab = 'preview'">Preview</button>
                      </div>
                      <div class="mt-segmented mt-zen-view-toggle" role="group" aria-label="Zen editor view" x-show="contentEditor.zen">
                        <button class="mt-segment" type="button" :aria-pressed="contentEditor.zenView === 'write'" @click="contentEditor.setZenView(contentContext(), 'write')">Write</button>
                        <button class="mt-segment" type="button" :aria-pressed="contentEditor.zenView === 'split'" @click="contentEditor.setZenView(contentContext(), 'split')">Split</button>
                        <button class="mt-segment" type="button" :aria-pressed="contentEditor.zenView === 'preview'" @click="contentEditor.setZenView(contentContext(), 'preview')">Preview</button>
                      </div>
                      <button type="button" class="mt-button mt-button-quiet mt-button-icon mt-zen-toggle"
                              :aria-label="contentEditor.zen ? 'Exit Zen mode' : 'Enter Zen mode'"
                              :title="contentEditor.zen ? 'Exit Zen mode (Esc)' : 'Zen mode (⌘/Ctrl+Shift+F)'"
                              :aria-pressed="contentEditor.zen"
                              @click="contentEditor.toggleZen(contentContext())">
                        <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                          <path x-show="!contentEditor.zen" d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                          <path x-show="contentEditor.zen" d="M4 14h6v6M20 10h-6V4M10 14l-7 7M14 10l7-7"/>
                        </svg>
                      </button>
                    </div>
                    <div class="mt-zen-workspace" :class="{ 'is-zen': contentEditor.zen, 'is-split': contentEditor.zen && contentEditor.zenView === 'split', 'is-preview': contentEditor.zen && contentEditor.zenView === 'preview' }">
                      <div class="mt-zen-editor-pane mt-editor-surface-host"
                           x-show="contentEditor.zen ? contentEditor.zenView !== 'preview' : contentEditor.tab === 'write'"
                           x-effect="contentEditor.syncSurface(contentContext(), $el)">
                        <textarea class="mt-field mt-content-input" x-ref="detailContentInput"
                                  x-show="!contentEditor.isCustomMounted()"
                                  x-model="contentEditor.text"
                                  @input="contentEditor.persist(contentContext()); contentEditor.schedulePreview(contentContext()); contentEditor.updateMention(contentContext(), $el)"
                                  @click="contentEditor.updateMention(contentContext(), $el)"
                                  @keydown="contentEditor.handleMentionKeydown(contentContext(), $event, $el)"
                                  @keyup="contentEditor.handleMentionKeyup(contentContext(), $event, $el)"
                                  @scroll="contentEditor.repositionMention($el)"
                                  @blur="contentEditor.closeMention()"
                                  :disabled="draftBusy || contentEditor.saving" aria-label="Content Markdown"
                                  :aria-expanded="String(Boolean(contentEditor.mention?.open && contentEditor.mention?.items?.length))"
                                  aria-controls="mt-detail-mention-list"
                                  aria-autocomplete="list"
                                  :aria-activedescendant="(contentEditor.mention?.open && contentEditor.mention?.items?.length) ? ('mt-detail-mention-' + contentEditor.mention.activeIndex) : null"
                                  @keydown.meta.enter.prevent="contentEditor.save(contentContext())"
                                  @keydown.ctrl.enter.prevent="contentEditor.save(contentContext())"></textarea>
                        {detail_mention_menu}
                      </div>
                      <div class="mt-preview mt-content-preview mt-zen-preview"
                           x-show="contentEditor.zen ? (contentEditor.zenView === 'split' || contentEditor.zenView === 'preview') : contentEditor.tab === 'preview'"
                           x-html="contentEditor.zen ? contentEditor.previewHtml : contentEditor.preview(contentContext())"
                           @click="openReference($event)" @mouseover="onReferenceHover($event)" @mouseout="onReferenceLeave($event)" @focusin="onReferenceHover($event)" @focusout="onReferenceLeave($event)"></div>
                    </div>
                    <div class="mt-composer-recovery-warning" role="status" x-show="contentEditor.unsavedOffer">
                      <span>Restore unsaved text?</span>
                      <button type="button" class="mt-button mt-button-compact mt-button-primary" @click="contentEditor.restoreUnsaved(contentContext())">Restore</button>
                      <button type="button" class="mt-button mt-button-compact" @click="contentEditor.dismissUnsaved()">Dismiss</button>
                    </div>
                    <p class="mt-composer-recovery-warning" role="status" x-show="contentEditor.error" x-text="contentEditor.error"></p>
                    <footer class="mt-content-footer">
                      <span class="mt-composer-storage-status" role="status"></span>
                      <div class="mt-layout-group" role="group" aria-label="Content editor actions">
                        <button type="button" class="mt-button" x-show="contentEditor.conflict" @click="contentEditor.reloadKeepingText(contentContext())" :disabled="contentEditor.saving" title="Loads the latest card hash; saving will replace the card's current body with your text">Reload card, keep my text</button>
                        <button type="button" class="mt-button" @click="contentEditor.close(contentContext())" :disabled="contentEditor.saving">Cancel</button>
                        <button type="button" class="mt-button mt-button-primary" @click="contentEditor.save(contentContext())" :disabled="!contentEditor.canSave(contentContext()) || contentEditor.saving" :aria-busy="contentEditor.saving">Save content</button>
                      </div>
                    </footer>
                  </div>
                </template>
                <div class="mt-preview" x-show="!contentEditor.open" x-ref="preview" x-html="previewHtml" @click="openReference($event); toggleTaskCheckbox($event)" @mouseover="onReferenceHover($event)" @mouseout="onReferenceLeave($event)" @focusin="onReferenceHover($event)" @focusout="onReferenceLeave($event)"></div>
                <template x-for="field in textPropertyFields()" :key="field.key">
                  <section class="mt-text-property" x-show="!contentEditor.open" :aria-label="field.label">
                    <header class="mt-text-property-header">
                      <h3 x-text="field.label"></h3>
                      <button type="button" class="mt-button mt-button-quiet mt-button-compact" x-show="textPropertyEditing !== field.key"
                              @click="editTextProperty(field.key)" :disabled="busy || draftBusy || propertyEditor.saving || detailLoading"
                              :aria-label="(field.value ? 'Edit ' : 'Add ') + field.label.toLowerCase()" x-text="field.value ? 'Edit' : 'Add'"></button>
                    </header>
                    <div class="mt-preview mt-property-markdown" x-show="field.value && textPropertyEditing !== field.key" x-html="field.html"
                         @click="openReference($event)" @mouseover="onReferenceHover($event)" @mouseout="onReferenceLeave($event)" @focusin="onReferenceHover($event)" @focusout="onReferenceLeave($event)"></div>
                    <p class="mt-text-property-empty" x-show="!field.value && textPropertyEditing !== field.key" x-text="field.empty"></p>
                    <template x-if="textPropertyEditing === field.key">
                      <div class="mt-text-property-editor">
                        <textarea class="mt-field" rows="3" x-model="propertyEditor.form[field.key]" :aria-label="field.label" :placeholder="field.placeholder"
                                  x-init="$nextTick(() => $el.focus())" :disabled="busy || draftBusy || propertyEditor.saving"
                                  @keydown.escape.stop.prevent="cancelTextProperty(field.key)"
                                  @keydown.meta.enter.prevent="saveTextProperty()" @keydown.ctrl.enter.prevent="saveTextProperty()"></textarea>
                        <div class="mt-layout-group" role="group" :aria-label="field.label + ' actions'">
                          <button type="button" class="mt-button mt-button-compact" @click="cancelTextProperty(field.key)" :disabled="propertyEditor.saving">Cancel</button>
                          <button type="button" class="mt-button mt-button-primary mt-button-compact" @click="saveTextProperty()"
                                  :disabled="!propertyEditor.canApply(propertyContext())" :aria-busy="propertyEditor.saving">Save</button>
                        </div>
                      </div>
                    </template>
                  </section>
                </template>
                <button type="button" class="mt-button mt-button-quiet mt-button-compact mt-text-property-add"
                        x-show="!contentEditor.open && selected && !selected.processing_instructions && textPropertyEditing !== 'processing_instructions'"
                        @click="editTextProperty('processing_instructions')" :disabled="busy || draftBusy || propertyEditor.saving || detailLoading">
                  <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>
                  <span>Add processing instructions</span>
                </button>
                <div class="mt-card-properties-preview" x-show="!contentEditor.open" x-html="propertiesHtml" @click="openReference($event)" @mouseover="onReferenceHover($event)" @mouseout="onReferenceLeave($event)" @focusin="onReferenceHover($event)" @focusout="onReferenceLeave($event)"></div>
                <form class="mt-comment-composer" x-show="!contentEditor.open" @submit.prevent="commentSelected()">
                  <textarea class="mt-field" x-model="commentText" :disabled="busy" aria-label="Comment text" placeholder="Leave a comment"></textarea>
                  <button type="submit" class="mt-button mt-button-compact" :disabled="busy || !commentText.trim()" :aria-busy="busy">Comment</button>
                </form>
              </section>
              <aside class="mt-properties-panel" id="mt-detail-properties-panel" aria-label="Card properties" :class="{ 'is-zen-open': Boolean(contentEditor.open && contentEditor.zen && contentEditor.zenMetaOpen) }">
                <header class="mt-properties-header"><h3>Properties</h3></header>
                <form class="mt-properties-form" id="mt-properties-form" @submit.prevent="contentEditor.open && contentEditor.zen ? contentEditor.save(contentContext()) : propertyEditor.apply(propertyContext())">
                  <!-- Keyed by card so the shared editor re-initializes for each card's kind and values. -->
                  <template x-for="cardId in [selected?.id]" :key="cardId">
                    <div x-data="cardMetadataEditor(propertyEditor.form, false, 'drawer', cardMetadataConfig(), propertyEditor.errors, selected?.kind)"
                         x-effect="disabled = busy || draftBusy || propertyEditor.saving; syncIdentity(selected && selected?.id + ':' + propertyEditor.version, propertyEditor.form, propertyEditor.errors)"
                         @metadata-change="propertyEditor.form = { ...propertyEditor.form, ...$event.detail }">
                      {card_metadata_editor}
                    </div>
                  </template>
                  <p class="mt-composer-recovery-warning" role="status" x-show="propertyEditor.conflict">This card changed while you were editing. Your changes are kept here. Reset to load the latest properties.</p>
                  <p class="mt-composer-recovery-warning" role="status" x-show="propertyEditor.error" x-text="propertyEditor.error"></p>
                  <footer class="mt-properties-footer" x-show="propertyEditor.changed()">
                    <span class="mt-unsaved-indicator" role="status" x-text="contentEditor.open && contentEditor.zen ? 'Saved with Save content' : (contentEditor.open ? 'Save or close the content editor first' : 'Unsaved changes')"></span>
                    <button type="button" class="mt-button" @click="propertyEditor.begin(selected, taskDefaults)" :disabled="busy || draftBusy">Reset</button>
                    <button type="submit" class="mt-button mt-button-primary" x-show="!(contentEditor.open && contentEditor.zen)" :disabled="!propertyEditor.canApply(propertyContext())" :aria-busy="busy || propertyEditor.saving">Save changes</button>
                  </footer>
                </form>
              </aside>
            </div>
            <footer class="mt-detail-footer">
              <span>Created <time :datetime="selected?.created" :title="selected?.created" x-text="dateLabel(selected?.created)"></time></span>
              <span>Updated <time :datetime="selected?.updated" :title="selected?.updated" x-text="dateLabel(selected?.updated)"></time></span>
            </footer>
          </section>
          <div class="mt-card-popover"
               x-cloak
               x-show="hoverCard"
               x-transition.opacity.duration.120ms
               :style="`top: ${hoverPos.top}px; left: ${hoverPos.left}px; transform: ${hoverPos.placeAbove ? 'translateY(-100%)' : 'none'}; pointer-events: ${hoverCard ? 'auto' : 'none'};`"
               @mouseenter="keepHoverCard()"
               @mouseleave="scheduleClearHoverCard()">
            <template x-if="hoverDisplayCard">
              <div class="mt-card-popover-inner">
                <div class="mt-card-popover-header">
                  <span class="mt-ref" x-text="hoverDisplayCard?.ref"></span>
                  <span class="mt-badge mt-badge-neutral" x-text="hoverDisplayCard?.kind"></span>
                  <span class="mt-badge mt-status-badge" :class="statusBadgeClass(hoverDisplayCard?.status)" x-show="hoverDisplayCard?.status" x-text="statusText(hoverDisplayCard?.status)"></span>
                  <span class="mt-badge mt-priority" :class="priorityClass(hoverDisplayCard?.priority)" x-show="hasPriority(hoverDisplayCard?.priority)" x-text="hoverDisplayCard?.priority"></span>
                  <span class="mt-badge mt-badge-warning mt-needs-review" x-show="hoverDisplayCard?.needs_review">Needs review</span>
                </div>
                <div class="mt-card-popover-title" x-text="hoverDisplayCard?.title"></div>
                <template x-if="hoverDisplayCard?.next_action">
                  <div class="mt-card-popover-next">
                    <span class="mt-card-popover-label">Next:</span>
                    <span x-text="hoverDisplayCard?.next_action"></span>
                  </div>
                </template>
                <template x-if="!hoverDisplayCard?.next_action && hoverDisplayCard?.excerpt">
                  <div class="mt-card-popover-excerpt" x-text="hoverDisplayCard?.excerpt"></div>
                </template>
                <div class="mt-card-popover-meta" x-show="hoverDisplayCard?.project || hoverDisplayCard?.topic || hoverDisplayCard?.due || (hoverDisplayCard?.tags && hoverDisplayCard?.tags.length)">
                  <span class="mt-card-popover-meta-item" x-show="hoverDisplayCard?.project" x-text="'Project: ' + hoverDisplayCard?.project"></span>
                  <span class="mt-card-popover-meta-item" x-show="hoverDisplayCard?.topic" x-text="'Topic: ' + hoverDisplayCard?.topic"></span>
                  <time class="mt-badge mt-due" :class="dueClass(hoverDisplayCard)" x-show="hoverDisplayCard?.due" :datetime="hoverDisplayCard?.due" :title="hoverDisplayCard?.due" x-text="'Due ' + dateLabel(hoverDisplayCard?.due)"></time>
                  <template x-for="tag in (hoverDisplayCard?.tags || []).slice(0, 3)" :key="tag">
                    <span class="mt-badge mt-badge-success mt-tag" :title="tag" x-text="tag"></span>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
