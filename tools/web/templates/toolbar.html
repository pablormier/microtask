    <header class="mt-toolbar">
      <div class="mt-title-row">
        <h1 class="mt-brand">
          <span class="mt-brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" focusable="false">
              <defs>
                <clipPath id="mt-logo-clip">
                  <rect width="32" height="32" rx="7.5"/>
                </clipPath>
              </defs>
              <g clip-path="url(#mt-logo-clip)">
                <rect width="32" height="32" fill="#2563eb"/>
                <rect width="6.5" height="32" fill="#172554"/>
                <rect x="6.5" width="1" height="32" fill="#93c5fd" fill-opacity="0.35"/>
              </g>
              <path fill="#fff" d="M11.6 9.5L14.6 8.5V16.2C14.6 18.2 15.8 19.3 17.7 19.3C19.6 19.3 20.9 18.1 20.9 16V9.5L23.9 8.5V18.2C23.9 19 24.4 19.4 25.3 19.4L26.2 19.2V21.5C25.4 21.8 24.6 22 23.6 22C22 22 21.1 21.2 20.8 20C19.8 21.3 18.3 22 16.5 22C15.7 22 15.1 21.8 14.6 21.5V24.8L11.6 25.8V9.5Z"/>
            </svg>
          </span>
          <span class="mt-brand-wordmark">MicroTask</span>
          <span class="mt-sr-only"> Kanban</span>
        </h1>
        <div class="mt-mode-toggle mt-segmented" role="group" aria-label="Dashboard mode">
          <button class="mt-segment" type="button" :aria-pressed="mode === 'tasks'" @click="mode = 'tasks'">Tasks</button>
          <button class="mt-segment" type="button" :aria-pressed="mode === 'focus'" @click="mode = 'focus'">Focus</button>
          <button class="mt-segment" type="button" :aria-pressed="mode === 'notes'" @click="mode = 'notes'">Notes</button>
          <button class="mt-segment mt-drafts-tab" type="button" :aria-pressed="mode === 'drafts'" @click="mode = 'drafts'" :aria-label="'Drafts, ' + drafts.length + ' saved'">
            <span>Drafts</span><span class="mt-tab-count" x-show="drafts.length" x-text="drafts.length"></span>
          </button>
          <button class="mt-segment" type="button" :aria-pressed="mode === 'archive'" @click="mode = 'archive'" x-text="viewLabel('archive')"></button>
          <button class="mt-segment" type="button" :aria-pressed="mode === 'deadlines'" @click="mode = 'deadlines'">Deadlines</button>
        </div>
        <!-- Primary action first; conditional items sit after Filters so New, Search, and Filters stay anchored. -->
        <div class="mt-toolbar-actions">
          <button type="button" class="mt-button mt-button-primary mt-capture-new" @click="whenReady(() => beginNewCapture({ currentTarget: $el }))">
            <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>New</span>
          </button>
          <button type="button" class="mt-button mt-quick-search-trigger"
                  @click="whenReady(() => openQuickSearch())" aria-label="Quick search"
                  :title="'Quick search (' + quickSearchShortcutLabel() + ')'">
            <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
            </svg>
          </button>
          <button type="button" class="mt-button mt-filter-toggle" x-show="filtersApply()"
                  :aria-expanded="filtersOpen" aria-controls="mt-filters"
                  :aria-label="'Filters, ' + activeFilterCount() + ' active'"
                  :title="activeFilterCount() ? 'Filters (' + activeFilterCount() + ' active)' : 'Filters'"
                  @click="whenReady(() => { filtersOpen = !filtersOpen; })">
            <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3 6h4m4 0h10M3 12h10m4 0h4M3 18h4m4 0h10"/>
              <circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="9" cy="18" r="2"/>
            </svg>
            <span class="mt-badge mt-badge-accent" x-show="activeFilterCount() > 0" x-text="activeFilterCount()"></span>
          </button>
          <details class="mt-card-menu mt-timers-menu" x-show="runningTimerList().length" x-cloak
                   @click.outside="$el.open = false" @keydown.escape.stop="$el.open = false; $el.querySelector('summary').focus()">
            <summary class="mt-menu-trigger mt-timers-trigger"
                     :aria-label="runningTimerList().length === 1 ? '1 running timer' : runningTimerList().length + ' running timers'"
                     :title="runningTimerList().length === 1 ? '1 running timer' : runningTimerList().length + ' running timers'">
              <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg>
              <span class="mt-badge mt-badge-accent" x-text="runningTimerList().length"></span>
            </summary>
            <div class="mt-card-menu-items mt-menu-start mt-timers-menu-items">
              <span class="mt-menu-label">Running timers</span>
              <template x-for="timer in runningTimerList()" :key="timer.id">
                <a class="mt-timers-item" :href="referenceHref(timer)" @click="$el.closest('details').open = false">
                  <span class="mt-timers-item-title" x-text="timer.title"></span>
                  <span class="mt-timers-item-meta" x-text="timerMetaLabel(timer)"></span>
                </a>
              </template>
            </div>
          </details>
          <button type="button" class="mt-button mt-capture-resume" x-show="captureComposer.draft && !captureComposer.open"
                  aria-label="Resume draft" title="Resume draft" @click="captureComposer.resume(captureContext(), $event)">
            <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20h4L19 9l-4-4L4 16v4ZM13 7l4 4"/></svg>
            <span class="mt-capture-resume-label">Resume draft</span>
          </button>
          <!-- Always present at the far right: display settings, and the account behind a sign-in proxy. -->
          <details class="mt-card-menu mt-settings-menu" @click.outside="$el.open = false" @keydown.escape.stop="$el.open = false; $el.querySelector('summary').focus()">
            <summary class="mt-menu-trigger mt-settings-trigger" :class="{ 'has-name': hosted }" aria-label="Display settings" title="Display settings"
                     :aria-label="hosted ? 'Signed in as ' + hosted.user + (hosted.email ? ' (' + hosted.email + ')' : '') + ', display settings' : (signOutUrl ? 'Account and display settings' : 'Display settings')"
                     :title="hosted ? (hosted.email ? hosted.user + ' (' + hosted.email + ')' : hosted.user) : (signOutUrl ? 'Account and display settings' : 'Display settings')">
              <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" x-show="!hosted && !signOutUrl"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17Z" fill="currentColor" stroke="none"/></svg>
              <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" x-show="hosted || signOutUrl" x-cloak><circle cx="12" cy="8.5" r="3.5"/><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0"/></svg>
              <span class="mt-account-name" x-show="hosted" x-text="hosted ? hosted.user : ''"></span>
            </summary>
            <div class="mt-card-menu-items mt-settings-menu-items">
              <template x-if="hosted">
                <div class="mt-account-summary">
                  <span class="mt-menu-label">Signed in as</span>
                  <div class="mt-account-identity">
                    <span class="mt-account-user" x-text="hosted.user"></span>
                    <span class="mt-badge mt-badge-neutral" x-show="hosted.admin">Admin</span>
                  </div>
                  <span class="mt-account-email" x-show="hosted.email" x-text="hosted.email"></span>
                </div>
              </template>
              <span class="mt-menu-label" id="mt-theme-label">Theme</span>
              <div class="mt-theme-choice mt-segmented" role="group" aria-labelledby="mt-theme-label">
                <button type="button" class="mt-segment" :aria-pressed="theme === 'system'" @click="setTheme('system')">System</button>
                <button type="button" class="mt-segment" :aria-pressed="theme === 'light'" @click="setTheme('light')">Light</button>
                <button type="button" class="mt-segment" :aria-pressed="theme === 'dark'" @click="setTheme('dark')">Dark</button>
              </div>
              <span class="mt-menu-label" id="mt-text-size-label">Text size</span>
              <div class="mt-text-size mt-segmented mt-segmented-quiet" role="group" aria-labelledby="mt-text-size-label">
                <button type="button" class="mt-segment mt-text-small" title="Small text" aria-label="Small text" :aria-pressed="textSize === 'small'" @click="setTextSize('small')">A</button>
                <button type="button" class="mt-segment mt-text-medium" title="Medium text" aria-label="Medium text" :aria-pressed="textSize === 'medium'" @click="setTextSize('medium')">A</button>
                <button type="button" class="mt-segment mt-text-large" title="Large text" aria-label="Large text" :aria-pressed="textSize === 'large'" @click="setTextSize('large')">A</button>
              </div>
              <span class="mt-menu-label" id="mt-empty-columns-label">Empty panels</span>
              <div class="mt-empty-columns mt-segmented" role="group" aria-labelledby="mt-empty-columns-label">
                <button type="button" class="mt-segment" :aria-pressed="emptyColumns === 'collapse'" @click="setEmptyColumns('collapse')">Collapse</button>
                <button type="button" class="mt-segment" :aria-pressed="emptyColumns === 'hide'" @click="setEmptyColumns('hide')">Hide</button>
                <button type="button" class="mt-segment" :aria-pressed="emptyColumns === 'show'" @click="setEmptyColumns('show')">Show</button>
              </div>
              <template x-if="(hosted && hosted.sign_out_url) || signOutUrl">
                <div class="mt-account-actions">
                  <a class="mt-account-signout" :href="(hosted && hosted.sign_out_url) || signOutUrl">Sign out</a>
                </div>
              </template>
            </div>
          </details>
        </div>
      </div>
      <search id="mt-filters" class="mt-filters" aria-label="Search and filters" x-show="filtersOpen && filtersApply()" x-cloak>
        <label class="mt-filter-search">
          <span class="mt-sr-only">Search</span>
          <input class="mt-field mt-field-compact" type="search" x-model="filters.text" aria-label="Search tasks" placeholder="Search">
        </label>
        <template x-for="facet in filterFacets()" :key="facet.key">
          <div class="mt-picker mt-filter" :class="{ 'is-active': facet.active, 'is-ignored': facet.note }" :title="facet.note || null"
               @focusout="if (pickerOpen(facet.key) && !$el.contains($event.relatedTarget)) closePicker()"
               @keydown.arrow-down.prevent="movePicker(facet.key, 1)" @keydown.arrow-up.prevent="movePicker(facet.key, -1)"
               @keydown.enter="pickerEnter(facet.key, $event)"
               @keydown.escape="if (pickerOpen(facet.key)) { $event.stopPropagation(); closePicker(); $el.querySelector('.mt-filter-chip').focus(); }">
            <div class="mt-filter-control">
              <button type="button" class="mt-button mt-button-compact mt-filter-chip" :disabled="!ready"
                      aria-haspopup="listbox" :aria-expanded="String(pickerOpen(facet.key))" :aria-controls="'mt-filter-' + facet.key + '-options'"
                      :aria-activedescendant="pickerOpen(facet.key) && picker.navigated && pickerRows(facet.key).length ? 'mt-filter-' + facet.key + '-option-' + picker.active : null"
                      @click="toggleFilterMenu(facet.key, $event)">
                <span class="mt-filter-summary" x-text="facet.summary"></span>
                <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7 10 5 5 5-5"/></svg>
              </button>
              <button type="button" class="mt-button mt-button-compact mt-button-icon mt-filter-reset" x-show="facet.active"
                      :aria-label="'Clear ' + facet.label + ' filter'" :title="'Clear ' + facet.label + ' filter'" @click="clearFilter(facet.key)">
                <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7 7 10 10M7 17 17 7"/></svg>
              </button>
            </div>
            <div class="mt-card-menu-items mt-menu-start mt-filter-menu" x-show="pickerOpen(facet.key)" x-cloak>
              <input class="mt-field mt-field-compact" type="search" autocomplete="off" x-show="facet.search"
                     :aria-label="'Narrow ' + facet.label.toLowerCase()" :placeholder="'Find ' + facet.label.toLowerCase()"
                     :aria-activedescendant="pickerOpen(facet.key) && picker.navigated && pickerRows(facet.key).length ? 'mt-filter-' + facet.key + '-option-' + picker.active : null"
                     :value="picker.query" @input.stop="setPickerQuery(facet.key, $event.target.value)">
              <ul class="mt-picker-list mt-picker-inline" role="listbox" :id="'mt-filter-' + facet.key + '-options'" :aria-label="facet.label" :aria-multiselectable="String(facet.multi)">
                <template x-for="(row, index) in pickerRows(facet.key)" :key="row.kind + ':' + row.name">
                  <li class="mt-picker-option" role="option" :id="'mt-filter-' + facet.key + '-option-' + index"
                      :class="{ 'is-active': picker.navigated && index === picker.active, 'is-clear': row.kind === 'clear' }"
                      :style="row.depth ? { paddingLeft: (8 + row.depth * 14) + 'px' } : null"
                      :aria-selected="String(row.kind === 'option' && filterHas(facet.key, row.name))"
                      @mousedown.prevent @mousemove="picker.active = index; picker.navigated = true" @click="choosePickerRow(facet.key, row)">
                    <span class="mt-picker-check"><svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
                    <span class="mt-picker-name" x-text="row.kind === 'clear' ? 'Clear' : row.label"></span>
                    <span class="mt-picker-count" x-show="row.count" x-text="row.count" :title="row.count === 1 ? '1 card' : row.count + ' cards'"></span>
                  </li>
                </template>
                <li class="mt-picker-empty" x-show="!pickerRows(facet.key).length">No matches.</li>
              </ul>
            </div>
          </div>
        </template>
        <details class="mt-card-menu" @click.outside="$el.open = false" @keydown.escape.stop="$el.open = false; $el.querySelector('summary').focus()">
          <summary class="mt-menu-trigger" :class="{ 'is-active': showHidden || needsReviewOnly }" aria-label="More filters" title="More filters">
            <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
          </summary>
          <div class="mt-card-menu-items mt-menu-start">
            <label class="mt-checkbox-filter"><input type="checkbox" x-model="showHidden"> Include hidden</label>
            <label class="mt-checkbox-filter"><input type="checkbox" x-model="needsReviewOnly"> Needs review only</label>
          </div>
        </details>
        <button type="button" class="mt-button mt-button-compact mt-filter-clear" x-show="activeFilterCount() > 0" @click="clearFilters()">Clear filters</button>
      </search>
    </header>
