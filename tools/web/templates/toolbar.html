    <header class="mt-toolbar">
      <div class="mt-title-row">
        <h1 class="mt-brand">
          <span class="mt-brand-mark" aria-hidden="true">MT</span>
          <span class="mt-brand-wordmark">MicroTask</span>
          <span class="mt-sr-only"> Kanban</span>
        </h1>
        <span class="mt-view-indicator" x-show="view" role="status"
              :title="view ? 'Changes apply to this copy. Source: ' + view.source : ''"
              :aria-label="view ? 'View ' + view.name + ' copy; changes apply here. Source: ' + view.source : ''"
              x-text="view ? 'View: ' + view.name + ' · copy' : ''"></span>
        <div class="mt-mode-toggle mt-segmented" role="group" aria-label="Dashboard mode">
          <button class="mt-segment" type="button" :aria-pressed="mode === 'tasks'" @click="mode = 'tasks'">Tasks</button>
          <button class="mt-segment" type="button" :aria-pressed="mode === 'focus'" @click="mode = 'focus'">Focus</button>
          <button class="mt-segment" type="button" :aria-pressed="mode === 'notes'" @click="mode = 'notes'">Notes</button>
          <button class="mt-segment mt-drafts-tab" type="button" :aria-pressed="mode === 'drafts'" @click="mode = 'drafts'" :aria-label="'Drafts, ' + drafts.length + ' saved'">
            <span>Drafts</span><span class="mt-tab-count" x-show="drafts.length" x-text="drafts.length"></span>
          </button>
          <button class="mt-segment" type="button" :aria-pressed="mode === 'archive'" @click="mode = 'archive'" x-text="viewLabel('archive')"></button>
          <button class="mt-segment" type="button" :aria-pressed="mode === 'deadlines'" @click="mode = 'deadlines'">Deadlines</button>
        </div>
        <p class="mt-demo-banner" x-show="demo">Demo workspace — bundled examples; every action works on them. Create your first task to start your own workspace.</p>
        <div class="mt-text-size mt-segmented mt-segmented-quiet" role="group" aria-label="Text size">
          <button type="button" class="mt-segment mt-text-small" title="Small text" aria-label="Small text" :aria-pressed="textSize === 'small'" @click="setTextSize('small')">A</button>
          <button type="button" class="mt-segment mt-text-medium" title="Medium text" aria-label="Medium text" :aria-pressed="textSize === 'medium'" @click="setTextSize('medium')">A</button>
          <button type="button" class="mt-segment mt-text-large" title="Large text" aria-label="Large text" :aria-pressed="textSize === 'large'" @click="setTextSize('large')">A</button>
        </div>
        <div class="mt-toolbar-actions">
          <button type="button" class="mt-button mt-filter-toggle" :disabled="!ready" x-show="filtersApply()"
                  :aria-expanded="filtersOpen" aria-controls="mt-filters" :aria-label="'Filters, ' + activeFilterCount() + ' active'"
                  @click="filtersOpen = !filtersOpen">
            <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3 6h4m4 0h10M3 12h10m4 0h4M3 18h4m4 0h10"/>
              <circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="9" cy="18" r="2"/>
            </svg>
            <span>Filters</span>
            <span class="mt-badge mt-badge-accent" x-show="activeFilterCount() > 0" x-text="activeFilterCount() + ' active'"></span>
          </button>
          <button type="button" class="mt-button mt-filter-clear" x-show="filtersApply() && activeFilterCount() > 0" @click="clearFilters()">Clear filters</button>
          <button type="button" class="mt-button mt-capture-resume" x-show="captureComposer.draft && !captureComposer.open"
                  @click="captureComposer.resume(captureContext(), $event)">Resume draft</button>
          <button type="button" class="mt-button mt-button-primary mt-capture-new" @click="beginNewCapture($event)" :disabled="!ready">
            <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>New</span>
          </button>
        </div>
      </div>
      <search id="mt-filters" class="mt-filters" aria-label="Search and filters" x-show="filtersOpen && filtersApply()" x-cloak>
        <label class="mt-filter-search">
          <span class="mt-sr-only">Search</span>
          <input class="mt-field mt-field-compact" type="search" x-model="filters.search" aria-label="Search tasks" placeholder="Search">
        </label>
        <template x-for="facet in filterFacets()" :key="facet.key">
          <div class="mt-picker mt-filter" :class="{ 'is-active': facet.active, 'is-ignored': facet.note }" :title="facet.note || null"
               @focusout="if (pickerOpen(facet.key) && !$el.contains($event.relatedTarget)) closePicker()"
               @keydown.arrow-down.prevent="movePicker(facet.key, 1)" @keydown.arrow-up.prevent="movePicker(facet.key, -1)"
               @keydown.enter="pickerEnter(facet.key, $event)"
               @keydown.escape="if (pickerOpen(facet.key)) { $event.stopPropagation(); closePicker(); $el.querySelector('.mt-filter-chip').focus(); }">
            <div class="mt-filter-control">
              <button type="button" class="mt-button mt-button-compact mt-filter-chip" :disabled="!ready"
                      aria-haspopup="listbox" :aria-expanded="String(pickerOpen(facet.key))" :aria-controls="'mt-filter-' + facet.key + '-options'"
                      :aria-activedescendant="pickerOpen(facet.key) && picker.navigated && pickerRows(facet.key).length ? 'mt-filter-' + facet.key + '-option-' + picker.active : null"
                      @click="toggleFilterMenu(facet.key, $event)">
                <span class="mt-filter-summary" x-text="facet.summary"></span>
                <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7 10 5 5 5-5"/></svg>
              </button>
              <button type="button" class="mt-button mt-button-compact mt-button-icon mt-filter-reset" x-show="facet.active"
                      :aria-label="'Clear ' + facet.label + ' filter'" :title="'Clear ' + facet.label + ' filter'" @click="clearFilter(facet.key)">
                <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7 7 10 10M7 17 17 7"/></svg>
              </button>
            </div>
            <div class="mt-card-menu-items mt-menu-start mt-filter-menu" x-show="pickerOpen(facet.key)" x-cloak>
              <input class="mt-field mt-field-compact" type="search" autocomplete="off" x-show="facet.search"
                     :aria-label="'Narrow ' + facet.label.toLowerCase()" :placeholder="'Find ' + facet.label.toLowerCase()"
                     :aria-activedescendant="pickerOpen(facet.key) && picker.navigated && pickerRows(facet.key).length ? 'mt-filter-' + facet.key + '-option-' + picker.active : null"
                     :value="picker.query" @input.stop="setPickerQuery(facet.key, $event.target.value)">
              <ul class="mt-picker-list mt-picker-inline" role="listbox" :id="'mt-filter-' + facet.key + '-options'" :aria-label="facet.label" :aria-multiselectable="String(facet.multi)">
                <template x-for="(row, index) in pickerRows(facet.key)" :key="row.kind + ':' + row.name">
                  <li class="mt-picker-option" role="option" :id="'mt-filter-' + facet.key + '-option-' + index"
                      :class="{ 'is-active': picker.navigated && index === picker.active, 'is-clear': row.kind === 'clear' }"
                      :style="row.depth ? { paddingLeft: (8 + row.depth * 14) + 'px' } : null"
                      :aria-selected="String(row.kind === 'option' && filterHas(facet.key, row.name))"
                      @mousedown.prevent @mousemove="picker.active = index; picker.navigated = true" @click="choosePickerRow(facet.key, row)">
                    <span class="mt-picker-check"><svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
                    <span class="mt-picker-name" x-text="row.kind === 'clear' ? 'Clear' : row.label"></span>
                    <span class="mt-picker-count" x-show="row.count" x-text="row.count" :title="row.count === 1 ? '1 card' : row.count + ' cards'"></span>
                  </li>
                </template>
                <li class="mt-picker-empty" x-show="!pickerRows(facet.key).length">No matches.</li>
              </ul>
            </div>
          </div>
        </template>
        <details class="mt-card-menu" @click.outside="$el.open = false" @keydown.escape.stop="$el.open = false; $el.querySelector('summary').focus()">
          <summary class="mt-menu-trigger" :class="{ 'is-active': showHidden || needsReviewOnly }" aria-label="More filters" title="More filters">
            <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
          </summary>
          <div class="mt-card-menu-items mt-menu-start">
            <label class="mt-checkbox-filter"><input type="checkbox" x-model="showHidden"> Include hidden</label>
            <label class="mt-checkbox-filter"><input type="checkbox" x-model="needsReviewOnly"> Needs review only</label>
          </div>
        </details>
      </search>
    </header>
