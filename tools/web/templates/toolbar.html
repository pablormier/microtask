    <header class="mt-toolbar">
      <div class="mt-title-row">
        <h1 class="mt-brand">
          <span class="mt-brand-mark" aria-hidden="true">MT</span>
          <span class="mt-brand-wordmark">MicroTask</span>
          <span class="mt-sr-only"> Kanban</span>
        </h1>
        <span class="mt-view-indicator" x-show="view" role="status"
              :title="view ? 'Changes apply to this copy. Source: ' + view.source : ''"
              :aria-label="view ? 'View ' + view.name + ' copy; changes apply here. Source: ' + view.source : ''"
              x-text="view ? 'View: ' + view.name + ' · copy' : ''"></span>
        <div class="mt-mode-toggle mt-segmented" role="group" aria-label="Dashboard mode">
          <button class="mt-segment" type="button" :aria-pressed="mode === 'tasks'" @click="mode = 'tasks'">Tasks</button>
          <button class="mt-segment" type="button" :aria-pressed="mode === 'focus'" @click="mode = 'focus'">Focus</button>
          <button class="mt-segment" type="button" :aria-pressed="mode === 'notes'" @click="mode = 'notes'">Notes</button>
          <button class="mt-segment mt-drafts-tab" type="button" :aria-pressed="mode === 'drafts'" @click="mode = 'drafts'" :aria-label="'Drafts, ' + drafts.length + ' saved'">
            <span>Drafts</span><span class="mt-tab-count" x-show="drafts.length" x-text="drafts.length"></span>
          </button>
          <button class="mt-segment" type="button" :aria-pressed="mode === 'archive'" @click="mode = 'archive'" x-text="viewLabel('archive')"></button>
          <button class="mt-segment" type="button" :aria-pressed="mode === 'deadlines'" @click="mode = 'deadlines'">Deadlines</button>
        </div>
        <p class="mt-demo-banner" x-show="demo">Demo workspace — bundled examples; every action works on them. Create your first task to start your own workspace.</p>
        <div class="mt-text-size mt-segmented mt-segmented-quiet" role="group" aria-label="Text size">
          <button type="button" class="mt-segment mt-text-small" title="Small text" aria-label="Small text" :aria-pressed="textSize === 'small'" @click="setTextSize('small')">A</button>
          <button type="button" class="mt-segment mt-text-medium" title="Medium text" aria-label="Medium text" :aria-pressed="textSize === 'medium'" @click="setTextSize('medium')">A</button>
          <button type="button" class="mt-segment mt-text-large" title="Large text" aria-label="Large text" :aria-pressed="textSize === 'large'" @click="setTextSize('large')">A</button>
        </div>
        <div class="mt-toolbar-actions">
          <button type="button" class="mt-button mt-filter-toggle" :disabled="!ready" x-show="isCardsView()"
                  :aria-expanded="filtersOpen" aria-controls="mt-filters" :aria-label="'Filters, ' + activeFilterCount() + ' active'"
                  @click="filtersOpen = !filtersOpen">
            <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3 6h4m4 0h10M3 12h10m4 0h4M3 18h4m4 0h10"/>
              <circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="9" cy="18" r="2"/>
            </svg>
            <span>Filters</span>
            <span class="mt-filter-active" x-show="activeFilterCount() > 0" x-text="activeFilterCount() + ' active'"></span>
          </button>
          <button type="button" class="mt-button mt-filter-clear" x-show="activeFilterCount() > 0" @click="clearFilters()">Clear filters</button>
          <button type="button" class="mt-button mt-capture-resume" x-show="captureComposer.draft && !captureComposer.open"
                  @click="captureComposer.resume(captureContext(), $event)">Resume draft</button>
          <button type="button" class="mt-button mt-button-primary mt-capture-new" @click="beginNewCapture($event)" :disabled="!ready">
            <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>New</span>
          </button>
        </div>
      </div>
      <div id="mt-filters" class="mt-filters" role="group" aria-label="Search and filter options"
           x-show="filtersOpen && isCardsView()">
        <section class="mt-filter-section" role="group" aria-labelledby="mt-filter-find">
          <span class="mt-filter-heading" id="mt-filter-find">Find</span>
          <div class="mt-filter-controls">
            <label class="mt-filter-search">
              <span class="mt-sr-only">Search</span>
              <input class="mt-field mt-field-compact" type="search" x-model="filters.search" aria-label="Search tasks" placeholder="Search">
            </label>
            <label class="mt-checkbox-filter"><input type="checkbox" x-model="showHidden"> Include hidden</label>
            <label class="mt-checkbox-filter"><input type="checkbox" x-model="needsReviewOnly"> Needs review only</label>
          </div>
        </section>
        <section class="mt-filter-section" role="group" aria-labelledby="mt-filter-task">
          <span class="mt-filter-heading" id="mt-filter-task">Task</span>
          <div class="mt-filter-controls">
            <label class="mt-field-status">
              <span class="mt-sr-only">Status</span>
              <select class="mt-field mt-field-compact" x-model="filters.status" aria-label="Filter by status">
                <option value="all">All statuses</option>
                <template x-for="s in statuses" :key="s"><option :value="s" x-text="statusText(s)"></option></template>
              </select>
            </label>
            <label class="mt-field-priority">
              <span class="mt-sr-only">Priority</span>
              <select class="mt-field mt-field-compact" x-model="filters.priority" aria-label="Filter by priority">
                <option value="all">All priorities</option>
                <template x-for="p in priorities" :key="p"><option :value="p" x-text="priorityLabel(p)"></option></template>
              </select>
            </label>
            <label class="mt-field-type">
              <span class="mt-sr-only">Type</span>
              <select class="mt-field mt-field-compact" x-model="filters.type" aria-label="Filter by type">
                <option value="all">All types</option>
                <template x-for="t in types" :key="t"><option :value="t" x-text="t"></option></template>
              </select>
            </label>
          </div>
        </section>
        <section class="mt-filter-section" role="group" aria-labelledby="mt-filter-context">
          <span class="mt-filter-heading" id="mt-filter-context">Context</span>
          <div class="mt-filter-controls">
            <label class="mt-field-project">
              <span class="mt-sr-only">Project</span>
              <select class="mt-field mt-field-compact" x-model="filters.project" aria-label="Filter by project">
                <option value="all">All projects</option>
                <template x-for="p in projects" :key="p"><option :value="p" x-text="p"></option></template>
              </select>
            </label>
            <div class="mt-field-topic mt-picker" @focusout="if (!$el.contains($event.relatedTarget)) closeTopicFilter()">
              <input class="mt-field mt-field-compact mt-picker-input" type="text" role="combobox" autocomplete="off" aria-autocomplete="list"
                     aria-label="Filter by topic" aria-controls="mt-topic-filter-options" :aria-expanded="String(topicFilter.open)"
                     :aria-activedescendant="topicFilter.open && topicFilter.navigated && topicFilterRows().length ? 'mt-topic-filter-option-' + topicFilter.active : null"
                     :value="topicFilter.open ? topicFilter.query : (filters.topic === 'all' ? '' : filters.topic)" :title="filters.topic === 'all' ? null : filters.topic"
                     :placeholder="topicFilter.open && filters.topic !== 'all' ? filters.topic : 'All topics'"
                     @click="openTopicFilter()" @input.stop="setTopicFilterQuery($event.target.value)"
                     @keydown.arrow-down.prevent="moveTopicFilter(1)" @keydown.arrow-up.prevent="moveTopicFilter(-1)"
                     @keydown.enter="topicFilterEnter($event)"
                     @keydown.escape="if (topicFilter.open) { $event.preventDefault(); $event.stopPropagation(); closeTopicFilter(); }">
              <ul class="mt-picker-list" role="listbox" id="mt-topic-filter-options" x-show="topicFilter.open" x-cloak>
                <template x-for="(row, index) in topicFilterRows()" :key="row.kind + ':' + row.name">
                  <li class="mt-picker-option" role="option" :id="'mt-topic-filter-option-' + index"
                      :class="{ 'is-active': topicFilter.navigated && index === topicFilter.active, 'is-clear': row.kind === 'clear' }"
                      :style="row.depth ? { paddingLeft: (8 + row.depth * 14) + 'px' } : null"
                      :aria-selected="String(row.kind === 'option' && row.name.toLowerCase() === filters.topic.toLowerCase())"
                      @mousedown.prevent @mousemove="topicFilter.active = index; topicFilter.navigated = true" @click="chooseTopicFilter(row)">
                    <span class="mt-picker-check"><svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
                    <span class="mt-picker-name" x-text="row.kind === 'clear' ? 'All topics' : row.label"></span>
                    <span class="mt-picker-count" x-show="row.count" x-text="row.count" :title="row.count === 1 ? '1 card, including subtopics' : row.count + ' cards, including subtopics'"></span>
                  </li>
                </template>
                <li class="mt-picker-empty" x-show="!topicFilterRows().length">No matching topics.</li>
              </ul>
            </div>
            <label class="mt-field-tag">
              <span class="mt-sr-only">Tag</span>
              <input class="mt-field mt-field-compact mt-tag-filter" type="search" x-model="filters.tag" aria-label="Filter by tag" placeholder="Tag">
            </label>
          </div>
        </section>
        <section class="mt-filter-section" role="group" aria-labelledby="mt-filter-time">
          <span class="mt-filter-heading" id="mt-filter-time">Time</span>
          <div class="mt-filter-controls">
            <label class="mt-field-due">
              <span class="mt-sr-only">Due</span>
              <select class="mt-field mt-field-compact" x-model="filters.due" aria-label="Filter by due date">
                <option value="all">All due</option>
                <option value="overdue">Overdue</option>
                <option value="today">Today</option>
                <option value="next7">Next 7 days</option>
                <option value="none">No due</option>
              </select>
            </label>
          </div>
        </section>
      </div>
    </header>
