<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MicroTask</title>
  <script nonce="{nonce}">
    // Apply the saved theme before first paint; board.js keeps it in sync afterwards.
    try {
      const choice = localStorage.getItem("mt-theme-v1");
      const dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    } catch (_) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0%25' stop-color='%23232c3d'/%3E%3Cstop offset='100%25' stop-color='%23131822'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='.5' y='.5' width='31' height='31' rx='7.5' fill='none' stroke='rgba(255,255,255,0.12)'/%3E%3Crect x='6.5' y='10' width='4.5' height='13' rx='1.5' fill='%233b82f6'/%3E%3Crect x='21' y='12.5' width='4.5' height='10.5' rx='1.5' fill='%233b82f6'/%3E%3Cpath d='M8.75 11.5 16 19 24.5 9.5' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>@import url("{pico_css}") layer(vendor);</style>
  <link rel="stylesheet" href="{katex_css}">
  <script defer src="{alpine_js}"></script>
  <script defer src="{marked_js}"></script>
  <script defer src="{dompurify_js}"></script>
  <script defer src="{katex_js}"></script>
  <script defer src="{katex_auto_render_js}"></script>
  <style>{dashboard_css}</style>
</head>
<body x-data="taskBoard()" x-cloak>
  <template x-if="!memberChanging">
  <div class="mt-app">
{toolbar}
    <main :aria-busy="loading || queryLoading">
      <p class="mt-load-status" role="status" x-show="loading">Loading workspace…</p>
      <div class="mt-load-error" role="alert" x-show="loadError" x-cloak>
        <p x-text="loadError"></p>
        <button type="button" class="mt-button" @click="loadWorkspace()" :disabled="loading">Retry loading</button>
      </div>
      <p class="mt-sr-only" role="status" x-show="ready && queryLoading">Updating results…</p>
      <div class="mt-load-error" role="alert" x-show="ready && queryError" x-cloak>
        <p x-text="queryError"></p>
        <button type="button" class="mt-button" @click="scheduleQuery(0, true)" :disabled="queryLoading">Retry results</button>
      </div>
      <template x-if="ready">
        <div>

{view_focus}
{view_cards}
{view_deadlines}
{view_drafts}
{drawer}
{capture_composer}
{quick_search}
        </div>
      </template>
    </main>
    <footer class="mt-demo-banner" role="status" x-show="demo" x-cloak>
      <span class="mt-demo-badge">Demo</span>
      <span>Bundled examples — every action works on them. Changes are deleted when you stop <code>mt demo</code>.</span>
    </footer>
    <div class="mt-toast-region" aria-live="polite">
      <template x-if="toast">
        <div class="mt-toast" :class="{ 'is-error': toast.error }" :role="toast.error ? 'alert' : 'status'" :key="toast.id">
          <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" x-show="!toast.error"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
          <svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" x-show="toast.error"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>
          <span class="mt-toast-text" x-text="toast.text"></span>
          <button type="button" class="mt-button mt-button-quiet mt-button-icon mt-button-compact mt-toast-close" aria-label="Dismiss message" @click="dismissToast()"><svg class="mt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
        </div>
      </template>
    </div>
  </div>
  </template>
  <template x-if="memberChanging">
    <main class="mt-load-error" aria-labelledby="mt-account-heading">
      <h1 id="mt-account-heading">Your signed-in account changed</h1>
      <p>Sign in to the account you want to use, then reload the workspace.</p>
      <button type="button" class="mt-button" x-init="$nextTick(() => $el.focus())" @click="reloadPage()">Reload workspace</button>
    </main>
  </template>
  <script type="application/json" id="mt-config">{config_json}</script>
  <script nonce="{nonce}">{app_script}</script>
</body>
</html>
