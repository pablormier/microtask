statuses:
  inbox: "Inbox"
  active: "Todo"
  doing: "In progress"
  waiting: "Waiting"
  someday: "Someday" # optional; remove if unused
  done: "Done"

view_labels:
  archive: "Archive"

priorities:
  urgent: "Time-sensitive or blocking important work"
  high: "Important and should be done soon"
  medium: "Normal priority after triage"
  low: "Minor or optional"
  none: "Unassigned; awaiting triage or reference material"

types:
  task: "Concrete action"
  bug: "Something broken that needs fixing"
  idea: "Possible future improvement"
  decision: "A decision to make or record"
  reminder: "Something to remember at a specific or approximate time"

due_kinds:
  deadline: "Hard due date; missing it matters"
  target: "Soft or ideal planning date"
  reminder: "Date to resurface the item, not completion pressure"

suggested_topics:   # where a card belongs; nest with /, e.g. work/project-x, personal/home
  - work
  - personal

suggested_tags:     # what kind of work it is; works across topics
  - reading       # articles, papers, books, docs
  - writing       # drafting or editing text
  - research      # investigating before deciding or building
  - code          # writing, reviewing, or debugging code
  - review        # giving feedback: PRs, papers, documents
  - meeting       # scheduling, preparing, or attending
  - followup      # waiting on or nudging someone
  - admin         # forms, accounts, expenses, paperwork
  - errand        # needs you somewhere in person
  - quick         # under 15 minutes; good for gaps

default_status: inbox
default_priority: none
default_type: task

rules:
  auto_sync: false
  allow_public_origin: false # mt sync refuses a public GitHub origin (checked when gh is installed)
  list_done_limit: 10
  max_doing_tasks: 5
  timer_warn_hours: 8 # warn about forgotten timers; never cap recorded time
  demo_workspace: true
  show_year_progress: true
  show_deadline_progress: true
  deadline_progress_start: created
